[package]
name = "raygeo"
version = "0.0.0"
edition = "2021"
description = "2D/3D geometry library for CAD/CAM applications with Python bindings"
license = "MIT"
repository = "https://github.com/barebaric/raygeo"
# The generated API docs (with their PNG galleries) push the package over
# crates.io's 10 MB upload limit; they stay on the website instead.
exclude = ["docs"]

[features]
# No defaults: embedding applications consume the pure Rust core with
# `default-features = false`. The Python build enables `python` and
# `allocator` (see [tool.maturin] in pyproject.toml).
default = []
python = ["dep:pyo3", "dep:pyo3-stub-gen", "dep:numpy"]
# Install raygeo's mimalloc global allocator. Only used by the Python
# wheel build; embedding applications keep their own allocator.
allocator = ["dep:mimalloc", "dep:libmimalloc-sys"]

[dependencies]
# The version is kept in sync with prof-macros/Cargo.toml by the release
# workflow (both are stamped from the release tag before publishing).
prof-macros = { path = "prof-macros", version = "0.1.0" }
libc = "0.2"
pyo3 = { version = "0.29", features = ["abi3", "abi3-py311", "py-clone"], optional = true }
numpy = { version = "0.29", optional = true }
rand = "0.10"
regex = "1"
pyo3-stub-gen = { version = "0.23.0", optional = true }
bitflags = "2"
clipper2 = "0.6"
earcut = "0.4"
num_enum = "0.7"
rstar = "0.13"
roxmltree = "0.21"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
glam = { version = "0.34", features = ["serde"] }
svgtypes = "0.16"
spade = "2"
nalgebra = "0.35"
nalgebra-sparse = "0.12"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
swash = { version = "0.2", features = ["scale", "render"] }
fontdb = "0.24"
zstd = "0.14"
mimalloc = { version = "0.1", optional = true }
libmimalloc-sys = { version = "0.1", features = ["extended"], optional = true }

[dev-dependencies]
approx = "0.5"

# rand's getrandom needs the JS backend on wasm32 (nesting uses rand).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[lib]
name = "raygeo"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
required-features = ["python"]
