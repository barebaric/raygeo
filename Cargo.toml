[package]
name = "rayforge-geo-py"
version = "0.1.3"
edition = "2021"
description = "PyO3 bindings for RayGeo geometry engine"

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }
rayforge-geo = { path = "crates/rayforge-geo" }
numpy = "0.28"

[lib]
name = "raygeo"
crate-type = ["cdylib"]