[package]
name = "raygeo"
version = "0.0.0"
edition = "2021"
description = "2D/3D geometry library for CAD/CAM applications with Python bindings"

[dependencies]
pyo3 = { version = "0.28", features = ["abi3", "abi3-py311"] }
numpy = "0.28"
pyo3-stub-gen = "0.22.3"
bitflags = "2"
clipper2 = "0.6"
num_enum = "0.7"
rstar = "0.12"
roxmltree = "0.20"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
approx = "0.5"

[lib]
name = "raygeo"
crate-type = ["cdylib", "lib"]
