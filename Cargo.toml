[package]
name = "raygeo"
version = "0.0.0"
edition = "2021"
description = "2D/3D geometry library for CAD/CAM applications with Python bindings"

[features]
default = ["python"]
python = ["dep:pyo3", "dep:pyo3-stub-gen", "dep:numpy"]

[dependencies]
prof-macros = { path = "prof-macros" }
libc = "0.2"
pyo3 = { version = "0.28", features = ["abi3", "abi3-py311", "py-clone"], optional = true }
numpy = { version = "0.28", optional = true }
rand = "0.10"
regex = "1"
pyo3-stub-gen = { version = "0.23.0", optional = true }
bitflags = "2"
clipper2 = "0.6"
earcut = "0.4"
num_enum = "0.7"
rstar = "0.13"
roxmltree = "0.21"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
glam = { version = "0.33", features = ["serde"] }
svgtypes = "0.16"
spade = "2"
nalgebra = "0.35"
nalgebra-sparse = "0.12"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
swash = { version = "0.2", features = ["scale", "render"] }
fontdb = "0.24"
zstd = "0.13"
mimalloc = "0.1"
libmimalloc-sys = { version = "0.1", features = ["extended"] }

[dev-dependencies]
approx = "0.5"

[lib]
name = "raygeo"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
required-features = ["python"]
