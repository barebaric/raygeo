[package]
name = "raygeo"
version = "0.0.0"
edition = "2021"
description = "2D/3D geometry library for CAD/CAM applications with Python bindings"

[features]
default = ["python"]
python = ["dep:pyo3", "dep:pyo3-stub-gen", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.28", features = ["abi3", "abi3-py311"], optional = true }
numpy = { version = "0.28", optional = true }
rand = "0.9"
pyo3-stub-gen = { version = "0.22.3", optional = true }
bitflags = "2"
clipper2 = "0.6"
num_enum = "0.7"
rstar = "0.12"
roxmltree = "0.20"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
glam = "0.29"
svgtypes = "0.14"
spade = "2"
nalgebra = "0.35"
nalgebra-sparse = "0.12"

[dev-dependencies]
approx = "0.5"

[lib]
name = "raygeo"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
required-features = ["python"]
