[package]
name = "prof-macros"
version = "0.1.0"
edition = "2021"
description = "Proc macro that instruments functions with raygeo's profiling guard"
license = "MIT"
repository = "https://github.com/barebaric/raygeo"

[lib]
proc-macro = true

[dependencies]
quote = "1"
syn = { version = "2", features = ["full"] }
