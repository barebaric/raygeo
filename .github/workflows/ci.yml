name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.68.1

      - name: Setup environment
        run: pixi install

      - name: Run lint
        run: pixi run lint

      - name: Build wheel
        run: pixi run build

      - name: Generate stubs
        run: pixi run gen-stubs

      - name: Run pyright
        run: pixi run pyright

      - name: Build wheel
        run: pixi run build-wheel

      - name: Validate stubs in wheel
        run: |
          python -m venv /tmp/stub-test
          /tmp/stub-test/bin/pip install dist/raygeo-*.whl
          /tmp/stub-test/bin/pip install pyright
          cat > /tmp/test_stubs.py << 'EOF'
          from raygeo import Geometry, Ops
          from raygeo.geo import CMD_TYPE_MOVE, COL_TYPE
          from raygeo.geo.types import Rect3D, Edge, IntPolygon
          g: Geometry
          o: Ops
          EOF
          /tmp/stub-test/bin/pyright /tmp/test_stubs.py

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.68.1

      - name: Setup environment
        run: pixi install

      - name: Run tests
        run: pixi run test
