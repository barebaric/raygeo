name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist

      - name: Install wheel
        run: pip install dist/raygeo-*.whl

      - name: Run pyright
        run: npx --yes pyright --pythonpath $(which python) raygeo

      - name: Validate stubs in wheel
        run: |
          cat > /tmp/test_stubs.py << 'EOF'
          from raygeo import Geometry, Ops
          g: Geometry
          o: Ops
          EOF
          npx --yes pyright --pythonpath $(which python) /tmp/test_stubs.py

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist

      - name: Install wheel
        shell: bash
        run: pip install dist/raygeo-*.whl

      - name: Install test dependencies
        run: pip install pytest

      - name: Run tests
        run: pytest -v
