name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Any base branch, so stacked pull requests (a fix based on another
    # open fix) get checks on their own diff, not just PRs to main.
    branches: ["**"]

# A new push to a PR makes the previous run obsolete. Cancel it instead
# of letting it occupy a runner and delay the result for the new commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # Installed with the toolchain so the wasm check does not need
          # a separate rustup invocation (and a second toolchain setup).
          targets: wasm32-unknown-unknown

      # Reuse dependency and incremental build artifacts between runs.
      # Without this, clippy and the unit tests recompile the entire
      # crate graph on every push.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (python feature, as the wheel build)
        run: cargo clippy --lib --features python -- -D warnings

      - name: Clippy (pure Rust, as embedded consumers and wasm build it)
        run: cargo clippy --lib --no-default-features -- -D warnings

      # Embedding applications build the core for wasm32; keep it clean.
      # The dependency tree is pure Rust, so no C/C++ cross-toolchain is
      # needed for this target.
      - name: Check wasm32
        run: cargo check --lib --target wasm32-unknown-unknown --no-default-features

      - name: Rust unit tests
        run: cargo test --lib --no-default-features

  # Build the Linux wheel once and hand it to the linting and Linux test
  # jobs. This turns three identical manylinux builds into one.
  linux-wheel:
    name: Build Linux wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          # Compiler cache shared between runs and jobs, including the
          # manylinux Docker build.
          sccache: true

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-linux-x86_64
          path: dist/*.whl
          if-no-files-found: error

  lint-and-typecheck:
    name: Lint and typecheck
    needs: linux-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-linux-x86_64
          path: dist

      - name: Install wheel
        run: pip install dist/raygeo-*.whl

      - name: Lint Python
        run: pip install ruff && ruff check tests/

      - name: Install viewer dependencies for type checking
        run: pip install matplotlib

      - name: Run pyright
        run: npx --yes pyright --pythonpath "$(which python)" python/raygeo

      - name: Validate stubs in wheel
        run: |
          cat > /tmp/test_stubs.py << 'EOF'
          from raygeo.geo import Geometry
          from raygeo.ops import Ops
          from raygeo.driver import Driver
          from raygeo.ops.convert import GcodeSpec
          g: Geometry
          o: Ops
          d: Driver
          s: GcodeSpec
          EOF
          npx --yes pyright --pythonpath "$(which python)" /tmp/test_stubs.py

  test-linux:
    name: Tests (ubuntu-latest)
    needs: linux-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-linux-x86_64
          path: dist

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install wheel
        run: pip install dist/raygeo-*.whl

      - name: Install test dependencies
        run: |
          pip install pytest pycairo pytest-asyncio pytest-mock \
            pytest-timeout pytest-xdist zeroconf

      # Fast lane: all tests except the explicitly marked slow, stress
      # and hardware suites. Slow/stress tests run in the nightly
      # workflow and before releases.
      - name: Run tests
        run: >
          pytest -v -m "not slow and not stress and not hardware"
          -n auto --dist loadscope --timeout=180

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Full coverage is on Linux above. Other platforms build the
        # wheel and run the smoke test; the nightly workflow runs the
        # complete suite on this full matrix.
        os:
          [ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          sccache: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo

      - name: Install wheel
        shell: bash
        run: pip install dist/raygeo-*.whl

      - name: Install test dependencies
        shell: bash
        run: |
          pip install pytest pycairo pytest-asyncio pytest-mock \
            pytest-timeout zeroconf

      - name: Run smoke tests
        shell: bash
        run: pytest -v -m smoke --timeout=120
