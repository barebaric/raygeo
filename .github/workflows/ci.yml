name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist

      - name: Install wheel
        run: pip install dist/raygeo-*.whl

      - name: Lint Python
        run: pip install ruff && ruff check tests/

      - name: Install viewer dependencies for type checking
        run: pip install matplotlib

      - name: Run pyright
        run: npx --yes pyright --pythonpath $(which python) python/raygeo

      - name: Validate stubs in wheel
        run: |
          cat > /tmp/test_stubs.py << 'EOF'
          from raygeo.geo import Geometry; from raygeo.ops import Ops
          g: Geometry
          o: Ops
          EOF
          npx --yes pyright --pythonpath $(which python) /tmp/test_stubs.py

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v7

      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo

      - name: Install wheel
        shell: bash
        run: pip install dist/raygeo-*.whl

      - name: Install test dependencies
        run: pip install pytest pycairo

      - name: Run tests
        run: pytest -v
