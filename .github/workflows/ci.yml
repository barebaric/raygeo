name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.68.1

      - name: Setup environment
        run: pixi install

      - name: Run lint
        run: pixi run lint

      - name: Build wheel
        run: pixi run build

      - name: Generate stubs
        run: pixi run gen-stubs

      - name: Run pyright
        run: pixi run pyright

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.68.1

      - name: Setup environment
        run: pixi install

      - name: Run tests
        run: pixi run test
