[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "raygeo"
dynamic = ["version"]
description = "Geometry, toolpath and machine-control infrastructure with Python bindings."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Samuel Abels", email = "knipknap@gmail.com" }
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "msgpack",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
test = [
    "pycairo",
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-split",
    "pytest-timeout",
    "pytest-xdist",
    "streamlit",
    "zeroconf",
]
visual = [
    "streamlit",
    "matplotlib",
]
docs = [
    "matplotlib",
    "mdformat",
    "mdformat-frontmatter",
    "mdformat-tables",
    "Pillow",
]
cli = [
    "matplotlib",
]

[project.scripts]
raygeo = "raygeo.cli.main:main"
raygeo-docs = "tools.cli:main"
raygeo-driver = "raygeo.driver.cli.main:main"

[tool.maturin]
module-name = "raygeo"
python-source = "python"
features = ["python"]

[tool.pyo3-stub-gen]
module-name = "raygeo"

[tool.pyright]
stubPath = "python"
reportMissingModuleSource = false
include = ["tests", "python", "tools"]
exclude = ["python/raygeo/cli", "python/raygeo/driver/cli"]
reportIncompatibleMethodOverride = false
reportIncompatibleVariableOverride = false
reportAttributeAccessIssue = false

[tool.ruff]
line-length = 79
exclude = ["*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["raygeo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Fails hung tests instead of stalling a CI job for hours.
timeout = 180
timeout_method = "thread"
markers = [
    "slow: heavy golden/render/large-fixture tests",
    "stress: timing- or teardown-sensitive stress tests",
    "platform: only meaningful on a specific operating system",
    "hardware: requires a real device; skipped by default",
    "smoke: small representative set run on every platform",
]
